name: agv-lab

services:
  postgres:
    image: postgres:18.6
    container_name: AL-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agv
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: rcs_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agv -d rcs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    container_name: AL-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: AL-mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # 檢查 MQTT Broker 1883 連接埠是否就緒
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  java21:
    build:
      context: ./rcs
      dockerfile: Dockerfile
    container_name: AL-java21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # 持久化儲存系統產生的地圖 JSON 檔案
      - rcs_map_storage:/app/map_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      # 確認 Spring Boot 與資料庫遷移完成並可回應 API
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/agvs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  node24:
    build:
      context: ./amr-web
      dockerfile: Dockerfile
    container_name: AL-node24
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      java21:
        condition: service_healthy

  ros2:
    build:
      context: ./ros2
      dockerfile: docker/Dockerfile
    container_name: AL-ros2
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
      java21:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  rcs_map_storage: