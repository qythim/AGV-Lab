
name: agv-lab

services:
  postgres:
    image: postgres:18.6
    container_name: AL-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agv
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: rcs_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agv -d rcs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    container_name: AL-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  java21:
    image: eclipse-temurin:21-jdk
    container_name: AL-java21
    restart: unless-stopped
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./rcs:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node24:
    image: node:24
    container_name: AL-node24
    restart: unless-stopped
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./amr-web:/app
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  maven_cache:
  node_modules:
