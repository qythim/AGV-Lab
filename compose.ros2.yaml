
services:
  ros2:
    build:
      context: ./ros2/docker
      dockerfile: Dockerfile

    container_name: AL-ros2
    image: ros:jazzy-ros-base
    working_dir: /workspace/ros2_ws

    volumes:
      - ./ros2/ros2_ws:/workspace/ros2_ws
      - ./maps:/workspace/maps:ro

    ports:
      - "127.0.0.1:9090:9090"

    environment:
      - ROS_DOMAIN_ID=0

    stdin_open: true
    tty: true

    restart: unless-stopped
